name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências (torch em CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" mongomock bandit pip-audit
      - name: Lint
        run: ruff check src apps tests scripts
      - name: Testes (sem rede)
        run: pytest -q -m "not network" --cov=trading_agent --cov-report=term-missing
      - name: Análise de segurança do código (bandit)
        run: bandit -q -r src apps scripts -c pyproject.toml
      - name: Vulnerabilidades conhecidas nas dependências (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off
