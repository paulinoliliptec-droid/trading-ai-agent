[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai-agent"
version = "0.1.0"
description = "Investigação quantitativa e paper trading para Forex (EUR/USD) e cripto (BTC/USD). Só simulação."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "ccxt>=4.2",
  "requests>=2.31",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pymongo>=4.6",
]

[project.optional-dependencies]
nn = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mongomock>=4.1", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["network: testes que precisam de acesso à Internet (desligados na CI)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.bandit]
# B101: assert só em testes; B311: random não criptográfico (reamostragem estatística, não segurança);
# B301/B403: pickle/joblib só para artefactos do próprio projeto, com SHA-256 verificado (models/registry.py).
skips = ["B101", "B311", "B301", "B403"]
